<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Report Cards | St Peter's Nkokonjeru SS</title>
<style>:root{font-family:Arial,sans-serif;color:#242424;background:#fff9e6}body{max-width:760px;margin:32px auto;padding:18px}main{background:white;padding:24px;border-radius:12px;box-shadow:0 5px 24px #0001}h1{color:#a71919}label{display:block;margin-top:16px;font-weight:600}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:6px}button{margin-top:20px;border:0;border-radius:6px;background:#a71919;color:white;font-weight:bold;cursor:pointer}small{color:#555}.status{margin-top:14px}</style></head>
<body><main><p><a href="home.html">← Back to school website</a></p><h1>Teacher Report Card Portal</h1><p>Sign in with your authorised teacher account. Your account must be assigned to the student's class and academic year by a school administrator.</p>
<form id="loginForm"><label>Email <input type="email" id="teacherEmail" required autocomplete="username"></label><label>Password <input type="password" id="teacherPassword" required autocomplete="current-password"></label><button type="submit">Sign in</button></form>
<section id="uploadSection" hidden><p id="signedInAs"></p><form id="reportForm"><label>Student admission number <input id="admissionNumber" required></label><label>Academic year <input id="academicYear" placeholder="2026" required></label><label>Term <select id="term" required><option value="">Choose term</option><option>Term 1</option><option>Term 2</option><option>Term 3</option></select></label><label>Report card (PDF/JPG/PNG, max 10 MB) <input id="reportFile" type="file" accept=".pdf,.jpg,.jpeg,.png" required></label><button type="submit">Upload report card</button></form><button id="signOut" type="button">Sign out</button></section><p class="status" id="status" role="status"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script>
<script>
const client=window.schoolSupabase,statusEl=document.getElementById('status');
function status(message,error=false){statusEl.textContent=message;statusEl.style.color=error?'#b00020':'#176b36'}
function portalState(session){document.getElementById('loginForm').hidden=!!session;document.getElementById('uploadSection').hidden=!session;document.getElementById('signedInAs').textContent=session?'Signed in as '+session.user.email:''}
client.auth.onAuthStateChange((_event,session)=>portalState(session));
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const {error}=await client.auth.signInWithPassword({email:document.getElementById('teacherEmail').value,password:document.getElementById('teacherPassword').value});if(error)status('Sign-in failed. Check your credentials or ask the school administrator.',true);else status('Signed in successfully.')});
document.getElementById('reportForm').addEventListener('submit',async e=>{e.preventDefault();const file=document.getElementById('reportFile').files[0];if(!file)return status('Select a report card.',true);if(!['application/pdf','image/jpeg','image/png'].includes(file.type)||file.size>10*1024*1024)return status('Use a PDF, JPG or PNG up to 10 MB.',true);const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;try{const {data:{user},error:authError}=await client.auth.getUser();if(authError||!user)throw new Error('Please sign in again.');const admission=document.getElementById('admissionNumber').value.trim();const year=document.getElementById('academicYear').value.trim();const term=document.getElementById('term').value;const {data:student,error:studentError}=await client.from('student_records').select('id,admission_number,class_name,academic_year').eq('admission_number',admission).eq('academic_year',year).eq('is_active',true).maybeSingle();if(studentError)throw studentError;if(!student)throw new Error('No active student found for that admission number and academic year, or your account cannot access the student.');const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=student.id+'/'+crypto.randomUUID()+'-'+safe;const up=await client.storage.from('student-report-cards').upload(path,file,{upsert:false,contentType:file.type});if(up.error)throw up.error;const {error}=await client.from('student_reports').insert([{student_id:student.id,academic_year:year,term:term,report_file_path:path,uploaded_by:user.id,is_published:false}]);if(error){await client.storage.from('student-report-cards').remove([path]);throw error}e.target.reset();status('Report card uploaded. It remains unpublished until authorised by the school.')}catch(err){console.error(err);status('Upload failed: '+(err.message||'check your access and try again.'),true)}finally{btn.disabled=false}});
document.getElementById('signOut').addEventListener('click',async()=>{await client.auth.signOut();status('You have signed out.')});
</script></body></html>
