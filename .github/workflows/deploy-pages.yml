name: Deploy school website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static website files
        run: |
          mkdir -p _site
          for file in *.html *.css *.js *.jpg *.jpeg *.png *.gif *.svg *.webp *.ico *.mp4 *.webm *.woff *.woff2 *.ttf; do
            if [ -f "$file" ]; then cp "$file" _site/; fi
          done
          for dir in assets images css js fonts; do
            if [ -d "$dir" ]; then cp -R "$dir" "_site/$dir"; fi
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
