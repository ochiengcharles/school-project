<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parent Report Cards | St Peter's Nkokonjeru SS</title>
<style>body{font-family:Arial,sans-serif;max-width:760px;margin:32px auto;padding:18px;background:#fff9e6;color:#222}main{background:#fff;padding:24px;border-radius:12px;box-shadow:0 5px 24px #0001}h1{color:#a71919}label{display:block;margin-top:16px;font-weight:600}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:6px}button{margin-top:20px;background:#a71919;color:white;border:0;border-radius:6px;cursor:pointer}.report{padding:12px;border-bottom:1px solid #ddd}.status{margin-top:14px}</style></head>
<body><main><p><a href="home.html">← Back to school website</a></p><h1>Parent / Guardian Portal</h1><p>Sign in using the account registered by the school. Report cards are available only after the school links your account to a student and publishes a report.</p>
<form id="loginForm"><label>Email <input id="email" type="email" required autocomplete="username"></label><label>Password <input id="password" type="password" required autocomplete="current-password"></label><button type="submit">Sign in</button></form>
<section id="reportsSection" hidden><h2>Available report cards</h2><button id="refresh" type="button">Refresh reports</button><div id="reports"></div><button id="signOut" type="button">Sign out</button></section><p id="status" class="status" role="status"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script>
<script>
const client=window.schoolSupabase,statusEl=document.getElementById('status');function status(t,e=false){statusEl.textContent=t;statusEl.style.color=e?'#b00020':'#176b36'}
function state(session){document.getElementById('loginForm').hidden=!!session;document.getElementById('reportsSection').hidden=!session;if(session)loadReports()}
client.auth.onAuthStateChange((_e,s)=>state(s));
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error)status('Sign-in failed. Check your details or contact the school office.',true);else status('Signed in successfully.')});
async function loadReports(){const box=document.getElementById('reports');box.replaceChildren();status('Loading linked student reports…');try{const {data,error}=await client.from('student_reports').select('id,student_id,academic_year,term,report_file_path,created_at,is_published').eq('is_published',true).order('created_at',{ascending:false});if(error)throw error;if(!data||!data.length){status('No published reports are available for your linked student account yet.');return}for(const r of data){const {data:student}=await client.from('student_records').select('admission_number,full_name').eq('id',r.student_id).maybeSingle();const item=document.createElement('div');item.className='report';const title=document.createElement('strong');title.textContent=(student?.full_name||'Linked student')+' — '+(r.academic_year||'')+' '+(r.term||'');const link=document.createElement('button');link.type='button';link.textContent='Open report card';link.addEventListener('click',async()=>{const {data,error}=await client.storage.from('student-report-cards').createSignedUrl(r.report_file_path,60);if(error){status('Unable to open report. Check guardian linkage and storage policies.',true);return}window.open(data.signedUrl,'_blank','noopener');});item.append(title,link);box.append(item)}status('Reports loaded. Access is limited by the guardian and storage policies.')}catch(err){console.error(err);status('Could not load reports. Contact the school administrator if access should be available.',true)}}
document.getElementById('refresh').addEventListener('click',loadReports);document.getElementById('signOut').addEventListener('click',async()=>{await client.auth.signOut();status('You have signed out.'});
</script></body></html>
