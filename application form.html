/* === Form === */
form {

  border-radius: 8px;
  box-shadow: 0 8px 12px rgba(0, 0, 0, 0.08);
}

label {

  font-weight: bold;
  color: var(--clr-red);
}

input[type="text"],
input[type="email"],
input[type="tel"],
input[type="date"],
input[type="file"],
select,
textarea {
  width: 100%;
  padding: 10px 12px;
  margin-top: 6px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
  font-size: 1rem;
}

textarea {
  resize: vertical;
}

/* === Button & File Selector === */
button {
  margin-top: 24px;
  background-color: var(--clr-red);
  color: #fff;
  padding: 14px 20px;
  border: none;
  border-radius: 4px;
  font-size: 1.05rem;
  cursor: pointer;
  box-shadow: 0 4px 6px rgba(198, 40, 40, 0.3);
  transition: background 0.25s ease, box-shadow 0.25s ease;
  width: 100%;
}

button:hover {
  background-color: var(--clr-red-dark);
  box-shadow: 0 4px 10px rgba(255, 214, 0, 0.4);
}

input[type="file"]::file-selector-button {
  background: var(--clr-red);
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.25s ease;
}

input[type="file"]::file-selector-button:hover {
  background: var(--clr-red-dark);
}

small {
  display: block;
  margin-top: 4px;
  font-size: 0.85em;
  color: #666;
}

/* === Responsive tweaks === */
@media (max-width: 480px) {
  .title-group h1 { font-size: 1.4rem; }
  .motto { font-size: 0.9rem; }
  form { padding: 16px; }
}
